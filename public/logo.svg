<svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Curved Path for Top Text: QUILL LABS -->
    <path id="topTextArc" d="M 68 250 A 182 182 0 1 1 432 250" fill="none" />
    <!-- Curved Path for Bottom Text: IDEAS • SYSTEMS • EXPERIENCES • FUTURE -->
    <path id="bottomTextArc" d="M 444 250 A 194 194 0 0 1 56 250" fill="none" />
    
    <!-- Star Definition -->
    <g id="sparkleStar">
      <path d="M 0 -13 C 0.8 -4 3.5 -0.8 11 0 C 3.5 0.8 0.8 4 0 13 C -0.8 4 -3.5 0.8 -11 0 C -3.5 -0.8 -0.8 -4 0 -13 Z" fill="#FFFFFF" />
    </g>
  </defs>

  <!-- Background Base -->
  <circle cx="250" cy="250" r="250" fill="#000000" />

  <!-- Outer Double Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#FFFFFF" stroke-width="5" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Inner Center Ring -->
  <circle cx="250" cy="250" r="162" fill="none" stroke="#FFFFFF" stroke-width="4.5" />

  <!-- Top Text: QUILL LABS -->
  <text fill="#FFFFFF" font-family="'Space Grotesk', 'Orbitron', 'Montserrat', -apple-system, sans-serif" font-size="36" font-weight="900" letter-spacing="5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">QUILL LABS</textPath>
  </text>

  <!-- Stars -->
  <!-- Left Star: rotated slightly along circle perimeter (~168 deg) -->
  <use href="#sparkleStar" x="72" y="202" transform="rotate(-12 72 202)" />
  <!-- Right Star: rotated slightly along circle perimeter (~12 deg) -->
  <use href="#sparkleStar" x="428" y="202" transform="rotate(12 428 202)" />

  <!-- Bottom Text: IDEAS • SYSTEMS • EXPERIENCES • FUTURE -->
  <text fill="#FFFFFF" font-family="'Space Grotesk', 'Montserrat', 'Inter', -apple-system, sans-serif" font-size="14.5" font-weight="700" letter-spacing="3.5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">IDEAS  •  SYSTEMS  •  EXPERIENCES  •  FUTURE</textPath>
  </text>

  <!-- Central Emblem: Geometric Faceted Origami Quill Monogram -->
  <g id="centerEmblem">
    <!-- Main Upper Diagonal Blade / Nib -->
    <path
      d="M 326 140
         L 326 186
         L 272 240
         L 226 286
         L 204 330
         L 188 330
         L 204 250
         L 260 196
         Z"
      fill="#FFFFFF"
    />

    <!-- Right Faceted Wing -->
    <path
      d="M 272 240
         L 296 264
         L 296 316
         L 266 346
         L 266 288
         Z"
      fill="#FFFFFF"
    />

    <!-- Bottom Left Foot -->
    <path
      d="M 184 334
         L 208 334
         L 198 356
         L 184 356
         Z"
      fill="#FFFFFF"
    />

    <!-- Bottom Wedge / Anchor -->
    <path
      d="M 220 324
         L 274 346
         L 242 346
         Z"
      fill="#FFFFFF"
    />
  </g>
</svg>
